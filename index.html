<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вадим — ссылки</title>
  <meta name="description" content="Все мои ссылки в одном месте">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #fde2e4;
      --bg-2: #cddafd;
      --card: rgba(255, 255, 255, 0.72);
      --card-hover: rgba(255, 255, 255, 0.92);
      --text: #1f2330;
      --muted: #5b6070;
      --accent: #4a5bd4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Manrope", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 56px 16px 40px;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: #fff;
      display: grid;
      place-items: center;
      font-size: 52px;
      box-shadow: 0 8px 24px rgba(31, 35, 48, 0.12);
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .bio {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .links {
      list-style: none;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 36px;
    }
    .links a {
      display: block;
      width: 100%;
      padding: 18px 20px;
      border-radius: 18px;
      background: var(--card);
      color: var(--text);
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(31, 35, 48, 0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }
    .links a:hover,
    .links a:focus-visible {
      transform: translateY(-3px);
      background: var(--card-hover);
      box-shadow: 0 10px 24px rgba(31, 35, 48, 0.12);
    }
    .links a:active { transform: translateY(-1px); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .socials {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .socials a {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--card);
      color: var(--text);
      transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease;
    }
    .socials a:hover { transform: translateY(-3px); background: var(--card-hover); color: var(--accent); }
    .socials svg { width: 22px; height: 22px; fill: currentColor; }
    footer { font-size: 13px; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <!-- 1. Аватар -->
    <div class="avatar" aria-hidden="true">🚀</div>

    <!-- 2. Имя -->
    <h1>Вадим Фамилия</h1>

    <!-- 3. Описание -->
    <p class="bio">Короткое описание: кто вы и чем помогаете</p>

    <!-- 4. Кнопки-ссылки: меняйте текст и адрес в href -->
    <ul class="links">
      <li><a href="https://example.com" target="_blank" rel="noopener">Мой сайт</a></li>
      <li><a href="https://example.com" target="_blank" rel="noopener">Портфолио</a></li>
      <li><a href="https://example.com" target="_blank" rel="noopener">Блог</a></li>
      <li><a href="https://example.com" target="_blank" rel="noopener">Записаться на консультацию</a></li>
    </ul>

    <!-- 5. Соцсети -->
    <nav class="socials" aria-label="Соцсети">
      <a href="https://t.me/username" target="_blank" rel="noopener" aria-label="Telegram">

      </a>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4Zm5.2-9.6a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4ZM12 2c-2.7 0-3.05.01-4.12.06-1.06.05-1.79.22-2.43.47a4.9 4.9 0 0 0-1.77 1.15 4.9 4.9 0 0 0-1.15 1.77c-.25.64-.42 1.37-.47 2.43C2.01 8.95 2 9.3 2 12s.01 3.05.06 4.12c.05 1.06.22 1.79.47 2.43.26.66.6 1.22 1.15 1.77.55.55 1.11.9 1.77 1.15.64.25 1.37.42 2.43.47 1.07.05 1.42.06 4.12.06s3.05-.01 4.12-.06c1.06-.05 1.79-.22 2.43-.47a4.9 4.9 0 0 0 1.77-1.15 4.9 4.9 0 0 0 1.15-1.77c.25-.64.42-1.37.47-2.43.05-1.07.06-1.42.06-4.12s-.01-3.05-.06-4.12c-.05-1.06-.22-1.79-.47-2.43a4.9 4.9 0 0 0-1.15-1.77 4.9 4.9 0 0 0-1.77-1.15c-.64-.25-1.37-.42-2.43-.47C15.05 2.01 14.7 2 12 2Zm0 1.8c2.67 0 2.99.01 4.04.06.98.04 1.5.2 1.86.34.47.18.8.4 1.15.75.35.35.57.68.75 1.15.14.35.3.88.34 1.86.05 1.05.06 1.37.06 4.04s-.01 2.99-.06 4.04c-.04.98-.2 1.5-.34 1.86-.18.47-.4.8-.75 1.15-.35.35-.68.57-1.15.75-.35.14-.88.3-1.86.34-1.05.05-1.37.06-4.04.06s-2.99-.01-4.04-.06c-.98-.04-1.5-.2-1.86-.34a3.1 3.1 0 0 1-1.15-.75 3.1 3.1 0 0 1-.75-1.15c-.14-.35-.3-.88-.34-1.86C3.81 14.99 3.8 14.67 3.8 12s.01-2.99.06-4.04c.04-.98.2-1.5.34-1.86.18-.47.4-.8.75-1.15.35-.35.68-.57 1.15-.75.35-.14.88-.3 1.86-.34C9.01 3.81 9.33 3.8 12 3.8Z"/></svg>
      </a>
      <a href="https://youtube.com/@username" target="_blank" rel="noopener" aria-label="YouTube">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>
      </a>
    </nav>

    <footer>© 2026</footer>
  </main>
</body>
</html>
