<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вадим Шульгин — ссылки</title>
  <meta name="description" content="Все мои ссылки в одном месте">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #e9f7ec;
      --bg-2: #c8ecd2;
      --card: rgba(255, 255, 255, 0.72);
      --card-hover: rgba(255, 255, 255, 0.92);
      --text: #1f2330;
      --muted: #5b6070;
      --accent: #2f8f55;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Manrope", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 56px 16px 40px;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .avatar {
      width: 148px;
      height: 180px;
      border-radius: 50%;
      background: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 24px rgba(31, 35, 48, 0.12);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      font-size: 36px;
      font-weight: 800;
      color: var(--accent);
    }
    .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: translateY(-8%) scale(1.2); transform-origin: 50% 55%; }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .bio {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .links {
      list-style: none;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 36px;
    }
    .links a {
      display: block;
      width: 100%;
      padding: 18px 20px;
      border-radius: 18px;
      background: var(--card);
      color: var(--text);
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(31, 35, 48, 0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }
    .links a:hover,
    .links a:focus-visible {
      transform: translateY(-3px);
      background: var(--card-hover);
      box-shadow: 0 10px 24px rgba(31, 35, 48, 0.12);
    }
    .links a:active { transform: translateY(-1px); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .socials {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .socials a {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--card);
      color: var(--text);
      transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease;
    }
    .socials a:hover { transform: translateY(-3px); background: var(--card-hover); color: var(--accent); }
    .socials svg { width: 22px; height: 22px; fill: currentColor; }
    footer { font-size: 13px; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <!-- 1. Аватар -->
    <!-- Чтобы поставить фото: положите рядом файл avatar.jpg. Пока его нет, показываются инициалы. -->
    <div class="avatar">
      <img src="avatar.jpg" alt="Вадим Шульгин" onerror="this.remove()">
      <span aria-hidden="true">ВШ</span>
    </div>

    <!-- 2. Имя -->
    <h1>Вадим Шульгин</h1>

    <!-- 3. Описание -->
    <p class="bio">Профессиональный трейдер, инвестиции в цифровые активы. Консультации в области криптоэкономики и VPN.</p>

    <!-- 4. Кнопки-ссылки: меняйте текст и адрес в href -->
    <ul class="links">
      <li><a href="https://example.com" target="_blank" rel="noopener">Мой сайт</a></li>
      <li><a href="https://example.com" target="_blank" rel="noopener">Портфолио</a></li>
      <li><a href="https://example.com" target="_blank" rel="noopener">Блог</a></li>
      <li><a href="https://example.com" target="_blank" rel="noopener">Записаться на консультацию</a></li>
    </ul>

    <!-- 5. Соцсети -->
    <nav class="socials" aria-label="Соцсети">
      <a href="https://t.me/Kvarctemp" target="_blank" rel="noopener" aria-label="Telegram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.94 4.3a1.3 1.3 0 0 0-1.33-.2L2.9 11.03c-.8.31-.78 1.46.03 1.73l4.46 1.5 1.72 5.4c.22.68 1.08.88 1.58.37l2.5-2.56 4.44 3.27c.6.44 1.45.11 1.6-.62L22.4 5.55a1.3 1.3 0 0 0-.46-1.25ZM9.8 14.5l-.47 3.3-1.1-3.73 9.8-6.4-8.23 6.83Z"/></svg>
      </a>
    </nav>

    <footer>© 2026</footer>
  </main>
</body>
</html>
